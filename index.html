    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 43%,
                    rgba(37, 211, 102, 0.10) 0,
                    rgba(37, 211, 102, 0.035) 18%,
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #050505 0%,
                    #0b0b0b 48%,
                    #050505 100%
                );

            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    transparent 0,
                    rgba(0,0,0,0.12) 55%,
                    rgba(0,0,0,0.55) 100%
                );
        }

        .page {
            width: 100%;
            max-width: 680px;
            min-height: 100vh;

            padding: 28px 20px 24px;

            display: flex;
            flex-direction: column;

            position: relative;
            z-index: 1;
        }


        /* ==============================
           العلامة التجارية
           ============================== */

        .brand {
            text-align: center;
            margin-top: 8px;
        }

        .brand-name {
            font-size: clamp(24px, 6vw, 34px);
            font-weight: 700;
            letter-spacing: 1.5px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #d8d8d8,
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .brand-line {
            width: 42px;
            height: 2px;

            margin: 10px auto 0;

            border-radius: 10px;

            background: #25D366;

            box-shadow:
                0 0 14px rgba(37,211,102,0.45);
        }

        .subtitle {
            margin-top: 10px;

            color: #999;

            font-size: 13px;
            letter-spacing: 0.4px;
        }


        /* ==============================
           المحتوى الرئيسي
           ============================== */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 20px 0 30px;
        }

        .headline {
            text-align: center;

            font-size: clamp(18px, 4.5vw, 24px);
            font-weight: 600;

            color: #eeeeee;

            margin-bottom: 32px;
        }


        /* ==============================
           زر واتساب الرئيسي
           ============================== */

        .whatsapp-main {
            width: clamp(145px, 39vw, 190px);
            height: clamp(145px, 39vw, 190px);

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #25D366;

            border: 1px solid rgba(255,255,255,0.18);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.60),
                0 0 0 8px rgba(37,211,102,0.055),
                0 0 42px rgba(37,211,102,0.25);

            text-decoration: none;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .whatsapp-main:hover {
            transform: translateY(-4px) scale(1.025);

            box-shadow:
                0 22px 52px rgba(0,0,0,0.65),
                0 0 0 10px rgba(37,211,102,0.07),
                0 0 55px rgba(37,211,102,0.34);
        }

        .whatsapp-main:active {
            transform: scale(0.94);

            filter: brightness(0.88);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.55),
                0 0 0 5px rgba(37,211,102,0.06);
        }


        /* ==============================
           شعار واتساب SVG
           ============================== */

        .whatsapp-icon {
            width: 55%;
            height: 55%;

            fill: #ffffff;

            display: block;
        }


        /* ==============================
           النص أسفل الزر الأوسط
           ============================== */

        .main-text {
            margin-top: 24px;

            color: #ffffff;

            font-size: 16px;
            font-weight: 600;

            letter-spacing: 0.2px;
        }

        .main-hint {
            margin-top: 7px;

            color: #858585;

            font-size: 12px;
        }


        /* ==============================
           الزر السفلي
           ============================== */

        .bottom-action {
            width: 100%;
            max-width: 500px;

            margin: 0 auto;

            min-height: 58px;

            padding: 0 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            border-radius: 15px;

            background:
                linear-gradient(
                    180deg,
                    #2b2b2b 0%,
                    #171717 100%
                );

            border: 1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.48),
                inset 0 1px 0 rgba(255,255,255,0.06);

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition:
                transform 0.16s ease,
                background 0.16s ease,
                border-color 0.16s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .bottom-action:hover {
            background:
                linear-gradient(
                    180deg,
                    #333333 0%,
                    #1d1d1d 100%
                );

            border-color:
                rgba(37,211,102,0.35);

            transform: translateY(-2px);
        }

        .bottom-action:active {
            transform: scale(0.97);

            background:
                linear-gradient(
                    180deg,
                    #25D366 0%,
                    #1daa52 100%
                );

            border-color: transparent;
        }

        .small-whatsapp {
            width: 23px;
            height: 23px;

            fill: #25D366;

            flex-shrink: 0;
        }

        .bottom-action:active .small-whatsapp {
            fill: #ffffff;
        }


        /* ==============================
           الفوتر
           ============================== */

        .footer {
            text-align: center;

            margin-top: 17px;

            color: #555;

            font-size: 10px;

            letter-spacing: 0.3px;
        }


        /* ==============================
           الشاشات الصغيرة جدًا
           ============================== */

        @media (max-height: 680px) {

            .page {
                padding-top: 20px;
                padding-bottom: 18px;
            }

            .headline {
                margin-bottom: 20px;
            }

            .main {
                padding-top: 10px;
                padding-bottom: 20px;
            }

            .main-text {
                margin-top: 17px;
            }
        }


        /* ==============================
           الكمبيوتر
           ============================== */

        @media (min-width: 700px) {

            .page {
                padding-top: 40px;
                padding-bottom: 35px;
            }

            .main {
                padding-top: 30px;
            }
        }


        /* ==============================
           تقليل الحركة
           ============================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
